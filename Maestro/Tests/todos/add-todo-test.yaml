appId: com.qacart.todo_app
tags:
  - E2E
---
- launchApp:
    clearState: true
    
- runFlow: 
    label: "Login Flow"
    file: "../../Flows/auth/login-flow.yaml"
    env: 
        EMAIL: "user@qacart.com"
        PASSWORD: "Test@1234"

- assertVisible:
    id: "plan_name"
    text: "Free plan"

# add the flow here 
- runFlow:
    label: "Add New Todo"
    file: "../../Flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn MAestro"
        TODO_INDEX: 0


- assertVisible:
    id: "todo_edit_button_0"

- assertVisible:
    id: "todo_delete_button_0"

- assertVisible:
    id: "plan_usage"
    text: "1 / 3"
