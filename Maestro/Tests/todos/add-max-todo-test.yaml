appId: com.qacart.todo_app
---
- launchApp:
    clearState: true
    
- runFlow: 
    label: "Login Flow"
    file: "../../Flows/auth/login-flow.yaml"
    env: 
        EMAIL: "user@qacart.com"
        PASSWORD: "Test@1234"

- assertVisible:
    id: "plan_name"
    text: "Free plan"

- runFlow:
    label: "Add New Todo"
    file: "../../Flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn MAestro1"
        TODO_INDEX: 0



- runFlow:
    label: "Add New Todo"
    file: "../../Flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn MAestro2"
        TODO_INDEX: 1



- runFlow:
    label: "Add New Todo"
    file: "../../Flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn MAestro3"
        TODO_INDEX: 2


- assertVisible:
    id: "add_todo_button"
    enabled: false















