appId: com.qacart.todo_app
---
- launchApp:
    clearState: true
    
- runFlow: 
    label: "Login Flow"
    file: "../../flows/auth/login-flow.yaml"
    env: 
        EMAIL: "user@qacart.com"
        PASSWORD: "Test@1234"

- assertVisible:
    id: "plan_name"
    text: "Free plan"

#upgrade flow 

#upgrade flow 

- runFlow:
    label: "Upgrade the plan "
    file: "../../flows/plan/upgrade-flow.yaml"
    env:
        PLAN_INDEX: 10


- assertVisible:
    id: "plan_name"
    text: "Pro plan"

- assertVisible:
    id: "plan_usage"
    text: "0 / 10"
- assertVisible:
    id: "cancel_subscription_button"